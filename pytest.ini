[pytest]
# Minimum version of pytest required
minversion = 7.0

# Command line arguments to always include
# --maxfail=2: stop after 2 failures
# -ra: show extra test summary info for all except passed tests
# --strict-markers: raise error for unregistered markers
addopts = -ra --maxfail=2 --strict-markers

# Directories to search for tests
testpaths =
    tests

# Patterns to find test files
python_files = test_*.py *TEST.py

# Patterns to find test classes
python_classes = Test* *Tests

# Patterns to find test functions
python_functions = test_*

# Custom markers for your project
markers =
    template: tests related to template processing logic
    security: tests for input validation and security checks
    slow: tests that take a long time to run

# Console output style
console_output_style = progress