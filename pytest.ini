[pytest]
# Minimum version of pytest required
minversion = 7.0

# Command line arguments to always include
# --maxfail=2: stop after 2 failures
# -ra: show extra test summary info for all except passed tests
# --strict-markers: raise error for unregistered markers
addopts = -ra --maxfail=2 --strict-markers

# Ensure the root is in the path so 'import subtrix' works correctly
pythonpath = .

# Directories to search for tests
testpaths = test_subtrix

# Directories to ignore during recursion
norecursedirs =
    .git
    .tox
    .env
    __pycache__
    dist
    build
    zz-tomb_
    zz-work_
    test_subtrix/temp

# Patterns to find test files
python_files = test_*.py *TEST.py

# Patterns to find test classes
python_classes = Test* *Tests

# Patterns to find test functions
python_functions = test_*

# Custom markers for your project
markers =
    template: tests related to template processing logic
    security: tests for input validation and security checks
    slow: tests that take a long time to run

# Console output style
console_output_style = progress
[tool:pytest]
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    smoke: marks tests as smoke tests
    database: marks tests that require database
    external: marks tests that require external services
    property: Property-based tests using Hypothesis
    security: Security fuzzing tests using Atheris
    stateful: Stateful testing using Hypothesis state machines
    realistic: Tests using realistic data from Faker

addopts =
    --hypothesis-show-statistics
    --hypothesis-profile=default
    -v

hypothesis_profiles =
    default:
    max_examples=100
    deadline=1000
    thorough:
    max_examples=1000
    deadline=10000
    quick:
    max_examples=10
    deadline=200